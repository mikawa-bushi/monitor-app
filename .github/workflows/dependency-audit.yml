name: Dependency Audit

# uv.lock に固定した依存に、既知の脆弱性がないかを pip-audit で調べる。
# 依存を変えていなくても新しい脆弱性は公開されるので、週 1 回も実行する。

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"  # 毎週月曜 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # uv のバージョンは Dockerfile の UV_VERSION とそろえる。
  UV_VERSION: "0.12.9"
  PIP_AUDIT_VERSION: "2.10.1"

jobs:
  pip-audit:
    name: pip-audit (uv.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
      - name: export the locked dependencies
        # 本体は PyPI に無いので除く(--no-emit-project)。extras と dev も含めて調べる。
        run: >
          uv export --locked --all-extras --all-groups --no-emit-project
          --format requirements-txt -o requirements-audit.txt
      - name: pip-audit
        # pip-audit は実行中の環境に合わないマーカーの依存を飛ばす。Linux で動かすため、
        # Windows 専用の colorama・tzdata は調べない(Dependabot の警告が見張る)。
        run: >
          uvx "pip-audit==${PIP_AUDIT_VERSION}" -r requirements-audit.txt
          --require-hashes --disable-pip --progress-spinner off
